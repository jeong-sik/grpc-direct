name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          opam-depext: true
      - name: Install dune
        run: opam install -y dune
      - name: Install OCaml deps
        run: opam install . --deps-only -y
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install h2spec
        run: go install github.com/summerwind/h2spec/cmd/h2spec@latest
      - name: Run h2spec smoke
        run: opam exec -- env H2SPEC="$HOME/go/bin/h2spec" ./ops/compliance/run_h2spec.sh

  interop_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          opam-depext: true
      - name: Install dune
        run: opam install -y dune
      - name: Install OCaml deps
        run: opam install . --deps-only -y
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run interop smoke
        run: opam exec -- ./ops/ci/run_interop_smoke.sh
