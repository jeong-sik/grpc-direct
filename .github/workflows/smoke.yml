name: smoke

on:
  push:
    branches: [main]
  pull_request:

env:
  # Mitigate transient opam download failures (e.g. occasional 5xx from upstream).
  OPAMRETRIES: 20

jobs:
  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          opam-depext: true
      - name: Install dune
        run: opam install -y dune
      - name: Pin external dependencies
        run: |
          opam pin add mcp_protocol https://github.com/jeong-sik/mcp-protocol-sdk.git#main -n -y
      - name: Install OCaml deps
        run: |
          for i in 1 2 3; do
            opam install . --deps-only -y && exit 0
            echo "opam install failed (attempt $i), retrying..." >&2
            sleep 5
          done
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install h2spec
        run: go install github.com/summerwind/h2spec/cmd/h2spec@v2.2.1
      - name: Run h2spec smoke
        run: opam exec -- env H2SPEC="$HOME/go/bin/h2spec" ./ops/compliance/run_h2spec.sh

  interop_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
          opam-depext: true
      - name: Install dune
        run: opam install -y dune
      - name: Pin external dependencies
        run: |
          opam pin add mcp_protocol https://github.com/jeong-sik/mcp-protocol-sdk.git#main -n -y
      - name: Install OCaml deps
        run: |
          for i in 1 2 3; do
            opam install . --deps-only -y && exit 0
            echo "opam install failed (attempt $i), retrying..." >&2
            sleep 5
          done
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run interop smoke
        run: opam exec -- ./ops/ci/run_interop_smoke.sh
